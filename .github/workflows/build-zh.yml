name: Build QubeVM x86 (Chinese localization)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'qube-android-lib/src/main/res/values-zh/**'
      - 'tools/gate-zh.py'
      - '.github/workflows/build-zh.yml'

env:
  UPSTREAM_APK: qube-x86-q11.1.2-android-arm64-v8a-release.apk
  UPSTREAM_TAG: "7.1.3"
  UPSTREAM_REPO: rhn-1k/QubeVM

jobs:
  gate:
    name: Localization Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Chinese localization gate
        run: python3 tools/gate-zh.py

  build:
    name: Build APK (arm64-v8a)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 37 + build-tools 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Fetch prebuilt native libs from upstream release
        run: |
          set -euo pipefail
          URL="https://github.com/${UPSTREAM_REPO}/releases/download/${UPSTREAM_TAG}/${UPSTREAM_APK}"
          echo "Downloading $URL"
          curl -sSL -o /tmp/upstream.apk "$URL"
          ls -la /tmp/upstream.apk
          # 只取 arm64-v8a 的 .so，装进 x86 模块的 jniLibs
          mkdir -p qube-android-x86/src/main/jniLibs
          unzip -q -o /tmp/upstream.apk 'lib/arm64-v8a/*' -d /tmp/upstream
          cp -r /tmp/upstream/lib/arm64-v8a qube-android-x86/src/main/jniLibs/
          echo "=== installed native libs ==="
          ls -la qube-android-x86/src/main/jniLibs/arm64-v8a/
          # 校验关键 .so 存在
          test -f qube-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so
          test -f qube-android-x86/src/main/jniLibs/arm64-v8a/libqube.so
          echo "native libs OK"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          ./gradlew :qube-android-x86:assembleRelease \
            -PqemuVersion=11.1.2 \
            --no-daemon --stacktrace

      - name: Locate APK
        run: |
          find . -name "*.apk" -type f -not -path "./.git/*"
          ls -la qube-android-x86/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qubevm-x86-zh-arm64
          path: qube-android-x86/build/outputs/apk/release/*.apk
          if-no-files-found: error
