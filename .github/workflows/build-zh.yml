name: Build QubeVM x86 (Chinese localization)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'qube-android-lib/src/main/res/values-zh/**'
      - 'tools/gate-zh.py'
      - '.github/workflows/build-zh.yml'

env:
  UPSTREAM_APK: qube-x86-q11.1.2-android-arm64-v8a-release.apk
  UPSTREAM_TAG: "7.1.3"
  UPSTREAM_REPO: rhn-1k/QubeVM

jobs:
  gate:
    name: Localization Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Chinese localization gate
        run: python3 tools/gate-zh.py

      - name: Run minSdk 29 (Android 10) gate
        run: python3 tools/gate-minsdk29.py

  build:
    name: Build APK (arm64-v8a)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ -z "${SDK_ROOT:-}" ]; then SDK_ROOT="$ANDROID_HOME"; fi
          echo "SDK_ROOT=$SDK_ROOT"
          # 找 cmdline-tools 里最新的 sdkmanager
          SDKMGR="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "SDKMGR=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          # 只装需要的包；不装 legacy 'tools'（已废弃，会 404）
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          echo "=== installed packages ==="
          ls "$SDK_ROOT/platforms/" || true
          ls "$SDK_ROOT/build-tools/" || true
          # AGP 找的是 platforms/android-37；若实际目录是 android-37.0 则建符号链接
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
            echo "symlinked android-37.0 -> android-37"
          fi
          ls "$SDK_ROOT/platforms/"

      - name: Fetch prebuilt native libs from upstream release
        run: |
          set -euo pipefail
          URL="https://github.com/${UPSTREAM_REPO}/releases/download/${UPSTREAM_TAG}/${UPSTREAM_APK}"
          echo "Downloading $URL"
          curl -sSL -o /tmp/upstream.apk "$URL"
          ls -la /tmp/upstream.apk
          # 只取 arm64-v8a 的 .so，装进 x86 模块的 jniLibs
          mkdir -p qube-android-x86/src/main/jniLibs
          unzip -q -o /tmp/upstream.apk 'lib/arm64-v8a/*' -d /tmp/upstream
          cp -r /tmp/upstream/lib/arm64-v8a qube-android-x86/src/main/jniLibs/
          echo "=== installed native libs ==="
          ls -la qube-android-x86/src/main/jniLibs/arm64-v8a/
          # 校验关键 .so 存在
          test -f qube-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so
          test -f qube-android-x86/src/main/jniLibs/arm64-v8a/libqube.so
          echo "native libs OK"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          ./gradlew :qube-android-x86:assembleRelease \
            -PqemuVersion=11.1.2 \
            --no-daemon --stacktrace

      - name: Locate APK
        run: |
          find . -name "*.apk" -type f -not -path "./.git/*"
          ls -la qube-android-x86/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qubevm-x86-zh-arm64
          path: qube-android-x86/build/outputs/apk/release/*.apk
          if-no-files-found: error
